name: Lean Action CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: warp-ubuntu-2404-x64-32x

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Proof integrity (no sorry / new axioms)
        run: ./Scripts/check-proof-integrity.sh
      # Build the docs (a non-default target). The Verso site splices the audited spec live via
      # `{docstring}` and `anchor` regions, so this fails on any spec/docs drift — a renamed
      # definition, a moved `-- ANCHOR:` marker, or an anchor code block that no longer matches
      # its source. Part of the required `build` check, so drift blocks the merge.
      - name: Docs build (spec/docs drift check)
        run: lake build docs
      # The optimizer binary, reused by the bench jobs below (and, from main runs, as the
      # baseline binary for PR benches — so PRs never rebuild main).
      - uses: actions/upload-artifact@v4
        with:
          name: apc-optimizer-bin
          path: .lake/build/bin/apc-optimizer
          retention-days: 30

  # One baseline for the whole workflow, resolved once and named in the report.
  #
  # Every consumer used to run its own `gh run list --branch main --status success --limit 1`: the
  # three effectiveness cells, the runtime cell, and the report footer — five independent
  # resolutions, free to land on five different commits, with the footer stating whichever the
  # *report* job happened to see. Measured on PR #278: one effectiveness cell benched a days-old
  # main binary (4-5x slower per case, and a different circuit on 3 of its 200 cases) while the
  # footer labelled the comparison with main's current sha. That reads as a -90% runtime win plus an
  # effectiveness regression, neither of which existed — and it takes a re-run against a freshly
  # built main to find that out. So: resolve here, prefer the PR's own base commit (the only baseline
  # whose diff *is* this PR), and hand every consumer the same run id.
  baseline:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      # `baseline_*` is what the whole suite benches against; `is_pr_base` says whether that happens
      # to be this PR's own base commit (the ideal) or a stand-in (drift is then in the numbers).
      run_id: ${{ steps.pick.outputs.run_id }}
      baseline_sha: ${{ steps.pick.outputs.baseline_sha }}
      is_pr_base: ${{ steps.pick.outputs.is_pr_base }}
    steps:
      - name: Resolve the main build to bench against
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          runs=$(gh run list --workflow "Lean Action CI" --branch main --status success \
            --limit 50 --json databaseId,headSha)
          # Candidates: this PR's base commit first (the only baseline whose diff *is* this PR), then
          # newest-first. Take the first whose binary still *exists*: a run stays listed forever but
          # its artifact is pruned at 30 days, so on a long-lived PR the base run can be selectable
          # with nothing to download -- which would leave the cells with no baseline while the report
          # still named a sha. Checking availability here keeps the printed sha benchable.
          ordered=$(jq -c --arg s "$PR_BASE_SHA" \
            '[.[] | select(.headSha == $s)] + [.[] | select(.headSha != $s)]' <<< "$runs")
          run_id=""; baseline_sha=""
          for i in $(seq 0 9); do
            cand=$(jq -c ".[$i] // empty" <<< "$ordered")
            [ -n "$cand" ] || break
            rid=$(jq -r '.databaseId' <<< "$cand")
            live=$(gh api "repos/$GH_REPO/actions/runs/$rid/artifacts" \
              --jq '[.artifacts[] | select(.name == "apc-optimizer-bin" and .expired == false)]
                    | length' 2>/dev/null || echo 0)
            if [ "${live:-0}" -gt 0 ]; then
              run_id=$rid
              baseline_sha=$(jq -r '.headSha' <<< "$cand")
              break
            fi
          done
          is_pr_base=false
          if [ -n "$baseline_sha" ] && [ "$baseline_sha" = "$PR_BASE_SHA" ]; then is_pr_base=true; fi
          if [ -z "$run_id" ]; then
            echo "::warning::no main build with a live apc-optimizer-bin artifact; PR-only report"
          elif [ "$is_pr_base" != true ]; then
            echo "::warning::baseline is main $baseline_sha, not this PR's base commit \
          $PR_BASE_SHA; size changes and the runtime row may be main's own drift"
          fi
          echo "baseline: run=$run_id sha=$baseline_sha is_pr_base=$is_pr_base \
          (pr base $PR_BASE_SHA)"
          {
            echo "run_id=$run_id"
            echo "baseline_sha=${baseline_sha:0:7}"
            echo "is_pr_base=$is_pr_base"
          } >> "$GITHUB_OUTPUT"

  # Effectiveness over the full OpenVM (openvm-eth, wasm-eth) and SP1 (rsp) sets plus the keccak and
  # sha256 stress sets. One cell per benchmark group, and each cell benches **both sides itself** --
  # this PR's binary then the `baseline` job's main build, back to back on the same runner.
  #
  # Circuit sizes are deterministic, so for effectiveness the sides needn't share a runner. But
  # benchmark.py also reports each side's wall time, and the report assembles those into the runtime
  # row: measured on two different instances of the same spec that comparison is meaningless, and it
  # has already misled us -- a change that a same-runner bench put at 0.86x on sha256 showed up here
  # as -2%. Groups still fan out across runners, which is where the parallelism belongs; only the
  # baseline/PR pair is forced onto one machine.
  effectiveness:
    if: github.event_name == 'pull_request'
    needs: [build, baseline]
    runs-on: warp-ubuntu-2404-x64-32x
    # Per group, since a cell now runs its sets twice. Measured: the sha256 cell is ~170 s for one
    # side, the others under a minute -- so this is headroom for the stress case growing, not a
    # current requirement.
    timeout-minutes: ${{ matrix.group.timeout }}
    strategy:
      fail-fast: false
      matrix:
        # `key` names the artifacts; `sets` is the space-separated list of `<vm>:<set>` tokens this
        # cell runs (vm picks the Benchmarks/<VM>/ dir + fact-aware backend: openvm -> BabyBear,
        # sp1 -> KoalaBear). Tiny sets ride along with a full one rather than paying for their own
        # runner: the OpenVM and SP1 keccak stress sets sit with openvm-eth; the full 200-case SP1
        # rsp set pairs with wasm-eth. The sha256 stress case gets its own group so its runtime does
        # not push another cell's timeout. Per-cell JSON/MD are keyed by a unique label (sp1 sets get
        # an `sp1-` prefix) so the two `keccak` sets don't collide.
        group:
          - { key: openvm, sets: "openvm:openvm-eth openvm:keccak sp1:keccak", timeout: 30 }
          - { key: wasm, sets: "openvm:wasm-eth sp1:rsp", timeout: 30 }
          - { key: sha, sets: "openvm:sha256", timeout: 45 }
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: PR binary
        uses: actions/download-artifact@v4
        with:
          name: apc-optimizer-bin
          path: bin-pr
      # Exactly the run the `baseline` job resolved -- no second query, so this cell cannot bench a
      # different commit than the report names. A missing artifact leaves no baseline at all, which
      # `report` already renders as PR-only; that is the honest outcome, unlike a silent swap.
      - name: Baseline binary (main ${{ needs.baseline.outputs.baseline_sha }})
        if: needs.baseline.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.baseline.outputs.run_id }}" -n apc-optimizer-bin -D bin-main \
            || true
          if [ ! -f bin-main/apc-optimizer ]; then
            echo "::warning::baseline artifact for main \
          ${{ needs.baseline.outputs.baseline_sha }} \
          is unavailable; PR-only report"
          fi
      - name: Effectiveness, both sides (${{ matrix.group.sets }})
        env:
          SETS: ${{ matrix.group.sets }}
        run: |
          chmod +x bin-pr/apc-optimizer
          if [ -f bin-main/apc-optimizer ]; then chmod +x bin-main/apc-optimizer; fi
          mkdir -p "$GITHUB_WORKSPACE/out-pr" "$GITHUB_WORKSPACE/out-main"
          # Warm the page cache before timing anything. Whichever side ran first would otherwise pay
          # to page in its own 123 MB binary and the inputs, which on a short set is larger than the
          # difference being measured -- measured locally, that cost alone turned a real 0.64x on
          # sp1:keccak into a reported +42%, i.e. it inverted the sign. Ordering cannot fix a
          # first-run penalty this size; only paying it before the clock starts can.
          for token in $SETS; do
            vm=${token%%:*}; bset=${token#*:}
            case "$vm" in openvm) d=OpenVM ;; sp1) d=SP1 ;; *) continue ;; esac
            cat "Benchmarks/$d/$bset"/*.json.gz > /dev/null 2>&1 || true
          done
          for side in pr main; do
            if [ -f "bin-$side/apc-optimizer" ]; then
              cat "bin-$side/apc-optimizer" > /dev/null 2>&1 || true
            fi
          done
          # One definition of the per-side run, so the label rule (which `report` depends on) is not
          # duplicated. `|| return 1` is explicit because `set -e` is suspended inside a function
          # called on the left of `||`.
          run_side() {
            side="$1"
            bin="$PWD/bin-$side/apc-optimizer"
            [ -f "$bin" ] || { echo "no $side binary; nothing to bench"; return 0; }
            for token in $SETS; do
              vm=${token%%:*}; bset=${token#*:}
              # Non-openvm sets get a `<vm>-` label prefix so SP1 keccak doesn't overwrite OpenVM's;
              # openvm keeps the bare label the report assembler expects.
              label=$bset
              if [ "$vm" != openvm ]; then label="$vm-$bset"; fi
              # Absolute output paths: benchmark.py chdirs to the repo, so a relative --json would
              # resolve against that rather than against this step's cwd.
              python3 Benchmarks/benchmark.py "$bset" --vm "$vm" --binary "$bin" \
                --json "$GITHUB_WORKSPACE/out-$side/$label.json" \
                --md "$GITHUB_WORKSPACE/out-$side/$label.md" || return 1
            done
          }
          rc=0
          run_side pr || rc=$?
          # The baseline is an older main build, so it can fail on inputs this checkout added. That
          # must not discard the PR-side results: the per-side matrix cells used to fail
          # independently, and `report` falls back to PR-only markdown when a baseline is missing.
          run_side main || echo "::warning::baseline bench failed; reporting PR-side results only"
          exit "$rc"
      # Two artifacts per cell, named exactly as the per-side cells used to be, so `report` still
      # merges `eff-pr-*` into pr/ and `eff-main-*` into main/ with no change.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eff-pr-${{ matrix.group.key }}
          path: out-pr
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eff-main-${{ matrix.group.key }}
          path: out-main
          if-no-files-found: ignore

  # Runtime detail, essentially the old quick-bench: the top-10 openvm-eth cases run sequentially
  # with per-pass profiling, this PR and latest main on the SAME runner so the comparison is honest.
  # Feeds the collapsed runtime detail (slowest cases + per-stage) in the report comment.
  bench-runtime:
    if: github.event_name == 'pull_request'
    needs: [build, baseline]
    runs-on: warp-ubuntu-2404-x64-32x
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apc-optimizer-bin
          path: bin-target
      - run: chmod +x bin-target/apc-optimizer
      # The same resolved baseline the effectiveness cells use (see the `baseline` job).
      - name: Baseline binary (main ${{ needs.baseline.outputs.baseline_sha }})
        if: needs.baseline.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh run download "${{ needs.baseline.outputs.run_id }}" -n apc-optimizer-bin \
              -D bin-base; then
            chmod +x bin-base/apc-optimizer
          fi
      - name: Runtime, top-10 sequential (per-stage + slowest)
        run: |
          python3 Benchmarks/runtime_bench.py openvm-eth --n 10 \
            --binary bin-target/apc-optimizer --json rt-pr.json
          if [ -f bin-base/apc-optimizer ]; then
            python3 Benchmarks/runtime_bench.py openvm-eth --n 10 \
              --binary bin-base/apc-optimizer --json rt-main.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bench-runtime
          path: rt-*.json
          if-no-files-found: ignore

  # One report: per set an effectiveness table (with a report-only runtime row) and, for openvm-eth,
  # the collapsed runtime detail from bench-runtime. Runs even if a job was skipped.
  #
  # This job publishes -- it does not comment. A `pull_request` run of a fork gets a read-only
  # GITHUB_TOKEN and public repos have no setting that changes that, so a comment step here is
  # unpostable on exactly the PRs that most need the report. Instead the markdown goes to the job
  # summary and to an artifact, and the `PR Report Comment` workflow posts it from base-repo context.
  report:
    if: always() && github.event_name == 'pull_request'
    needs: [baseline, effectiveness, bench-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Two artifacts per group cell (both sides, benched on that cell's runner); merge each side's
      # cells back into one dir so the assemble step still reads pr/$set.json and main/$set.json.
      - uses: actions/download-artifact@v4
        with: { pattern: eff-pr-*, path: pr, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: eff-main-*, path: main, merge-multiple: true }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with: { name: bench-runtime, path: rt }
        continue-on-error: true
      # The baseline sha comes from the `baseline` job -- the same run every cell downloaded.
      # Resolving it again here is what let the footer name a commit nobody benched.
      - name: Comment inputs
        id: note
        env:
          BASELINE_SHA: ${{ needs.baseline.outputs.baseline_sha }}
          BASELINE_IS_PR_BASE: ${{ needs.baseline.outputs.is_pr_base }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "pr_sha=$(cut -c1-7 <<< "$PR_HEAD_SHA")" >> "$GITHUB_OUTPUT"
          # The footer names a baseline only if one was actually benched. A resolved sha is not
          # enough: a cell can still fail to download it or time out, and then every set falls back
          # to PR-only markdown -- naming a sha there would describe a comparison that never ran.
          benched_sha="$BASELINE_SHA"
          if ! ls main/*.json > /dev/null 2>&1; then benched_sha=""; fi
          echo "benched_sha=$benched_sha" >> "$GITHUB_OUTPUT"
          # One line of prose when the comparison is against something other than this PR's base, so
          # a reader does not attribute main's own drift to the PR (see the `baseline` job).
          drift=""
          if [ -n "$benched_sha" ] && [ "$BASELINE_IS_PR_BASE" != true ]; then
            drift="**The baseline is not this PR's base commit**, so a changed size or a large \
          runtime delta may be main's own drift rather than this PR -- verify against a freshly \
          built base before believing either."
          fi
          echo "drift=$drift" >> "$GITHUB_OUTPUT"
      - name: Assemble comment
        run: |
          : > bench.md
          # Labels match the per-cell JSON/MD written by the effectiveness job (sp1 sets prefixed).
          for set in openvm-eth wasm-eth keccak sha256 sp1-rsp sp1-keccak; do
            if [ -f "main/$set.json" ]; then
              python3 Benchmarks/benchmark.py --compare "main/$set.json" "pr/$set.json" \
                --md "$set.md"
              cat "$set.md" >> bench.md
            elif [ -f "pr/$set.md" ]; then
              cat "pr/$set.md" >> bench.md
            fi
            # openvm-eth only: collapsed runtime detail (slowest cases + per-stage) from bench-runtime.
            if [ "$set" = openvm-eth ] && [ -f rt/rt-main.json ] && [ -f rt/rt-pr.json ]; then
              python3 Benchmarks/runtime_bench.py --details \
                --compare rt/rt-main.json rt/rt-pr.json --md rt.md
              cat rt.md >> bench.md
            fi
            printf '\n' >> bench.md
          done
      - name: Publish the report
        env:
          NOTE: >-
            openvm-eth + wasm-eth + keccak + sha256 + sp1/rsp + sp1/keccak,
            PR `${{ steps.note.outputs.pr_sha }}`
            ${{ steps.note.outputs.benched_sha
                 && format('vs main `{0}`', steps.note.outputs.benched_sha)
                 || '(no main baseline binary)' }}.
            ${{ steps.note.outputs.drift }}
            Effectiveness is exact. Each set's two sides are benched back to back on one runner, so
            the runtime row is comparable -- but coarse: benchmark.py runs cases in parallel. For
            per-pass detail: `gh workflow run "Runtime Bench" -f pr=${{ github.event.number }}`.
        run: |
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$NOTE" > note.md
      # Consumed by `PR Report Comment` (pr_report_comment.yml) via this run's id.
      - uses: actions/upload-artifact@v4
        with:
          name: pr-bench-report
          path: |
            bench.md
            note.md
